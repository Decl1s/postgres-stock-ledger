name: Контракт и транзакции мини-склада
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      UV_PYTHON_DOWNLOADS: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m unittest discover -s tests -v
      - run: uv run --frozen python scripts/package_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-${{ matrix.os }}
          path: |
            artifacts/postgres-stock-ledger-0.1.0.zip
            artifacts/SHA256SUMS
          if-no-files-found: error
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16.15
        env:
          POSTGRES_USER: lab_ci
          # Синтетическая тестовая база одноразового runner, не пароль пользователя.
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: stock_test
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U lab_ci -d stock_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      UV_PYTHON_DOWNLOADS: never
      STOCK_TEST_DSN: host=127.0.0.1 port=5432 dbname=stock_test user=lab_ci password=synthetic-ci-only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install uv==0.13.1
      - run: uv sync --frozen --no-dev
      - run: uv run --frozen python -m unittest discover -s tests -p integration.py -v
